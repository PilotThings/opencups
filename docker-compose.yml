services:
  postgresql:
    build: ./docker/postgresql
    image: copencups/postgresql
    container_name: copencups-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opencups}
      POSTGRES_USER: ${POSTGRES_USER:-opencups}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencups}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - copencups-pgdata:/var/lib/postgresql/data

volumes:
  copencups-pgdata:
